<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d3557">
<title>PTC Pop Licence</title>
<style>
  :root {
    --bleu: #1d3557; --bleu-clair: #e8eef7; --vert: #15803d;
    --rouge: #b91c1c; --gris: #64748b; --fond: #f8fafc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Arial, Helvetica, sans-serif; background: var(--fond);
    color: #0f172a; display: flex; flex-direction: column; font-size: 16px;
  }
  header { background: var(--bleu); color: #fff; padding: 8px 10px; }
  header h1 { font-size: 16px; margin: 0 0 8px 0; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .modes button {
    border: 0; border-radius: 8px; padding: 10px 4px; font-size: 15px;
    font-weight: 700; background: #2b4a75; color: #cbd5e1;
  }
  .modes button.actif { background: #fff; color: var(--bleu); }
  main { flex: 1; overflow-y: auto; padding: 10px; }
  label.lbl { display: block; font-size: 13px; color: var(--gris); margin: 8px 0 3px; }
  input, select {
    width: 100%; font-size: 20px; padding: 10px; border: 2px solid #cbd5e1;
    border-radius: 8px; background: #fff;
  }
  input:focus, select:focus { border-color: var(--bleu); outline: none; }
  select { font-size: 16px; }
  .qte { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .qte button {
    border: 0; border-radius: 8px; padding: 0 18px; font-size: 16px;
    font-weight: 700; background: var(--vert); color: #fff;
  }
  #message { min-height: 22px; margin: 8px 0 4px; font-weight: 700; font-size: 15px; }
  #message.ok { color: var(--vert); }
  #message.erreur { color: var(--rouge); }
  .totaux {
    background: var(--bleu-clair); border-radius: 8px; padding: 8px 10px;
    font-size: 14px; display: flex; justify-content: space-between;
  }
  ul { list-style: none; padding: 0; margin: 8px 0 0; }
  li {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 8px; margin-bottom: 6px; display: grid;
    grid-template-columns: 1fr auto; gap: 4px; align-items: center;
  }
  li .code { font-family: monospace; font-size: 16px; font-weight: 700; word-break: break-all; }
  li .motif { font-size: 12px; color: var(--gris); }
  li .actions { display: flex; gap: 4px; align-items: center; }
  li .actions button {
    width: 38px; height: 38px; border: 1px solid #cbd5e1; border-radius: 8px;
    background: #fff; font-size: 18px; font-weight: 700;
  }
  li .actions .n { min-width: 34px; text-align: center; font-size: 18px; font-weight: 700; }
  li .actions .suppr { color: var(--rouge); }
  footer {
    display: grid; grid-template-columns: 2fr 1fr; gap: 8px; padding: 8px 10px;
    background: #fff; border-top: 1px solid #e2e8f0;
  }
  footer button {
    border: 0; border-radius: 8px; padding: 14px 4px; font-size: 17px;
    font-weight: 700; color: #fff; background: var(--bleu);
  }
  footer button.danger { background: #fff; color: var(--rouge); border: 2px solid var(--rouge); }
  .vide { text-align: center; color: var(--gris); padding: 18px 0; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1 id="titre">PTC Pop Licence</h1>
  <div class="modes">
    <button data-mode="reception">Réception</button>
    <button data-mode="inventaire">Inventaire</button>
    <button data-mode="casse">Casse</button>
  </div>
</header>

<main>
  <div id="zoneMotif" hidden>
    <label class="lbl" for="motif">Motif de la casse</label>
    <select id="motif">
      <option value="">— Choisir un motif —</option>
      <option>Cassé ou abîmé à la réception</option>
      <option>Défaut de fabrication</option>
      <option>Abîmé en stock</option>
      <option>Retour client invendable</option>
      <option>Produit manquant ou perdu</option>
      <option>Autre</option>
    </select>
  </div>

  <label class="lbl" for="code">Code-barres (scanner)</label>
  <input id="code" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false">

  <label class="lbl" for="qte">Quantité</label>
  <div class="qte">
    <input id="qte" type="number" inputmode="numeric" min="1" value="1">
    <button id="ajouter">Ajouter</button>
  </div>

  <div id="message"></div>

  <div class="totaux">
    <span id="nbLignes">0 référence</span>
    <span id="nbPieces">0 pièce</span>
  </div>

  <ul id="liste"></ul>
</main>

<footer>
  <button id="exporter">Exporter le fichier</button>
  <button id="vider" class="danger">Vider</button>
</footer>

<script>
(function () {

  var NOMS = { reception: "Réception", inventaire: "Inventaire", casse: "Casse" };

  var mode = lire("ptc_mode") || "reception";
  var codeEnAttente = "";

  var champCode = document.getElementById("code");
  var champQte = document.getElementById("qte");
  var champMotif = document.getElementById("motif");
  var zoneMotif = document.getElementById("zoneMotif");
  var liste = document.getElementById("liste");
  var message = document.getElementById("message");

  /* ---------- Mémoire du PTC (garde la liste même éteint) ---------- */

  function lire(cle) {
    try { return localStorage.getItem(cle); } catch (e) { return null; }
  }

  function ecrire(cle, valeur) {
    try { localStorage.setItem(cle, valeur); } catch (e) {}
  }

  function lignes() {
    try { return JSON.parse(lire("ptc_" + mode) || "[]"); } catch (e) { return []; }
  }

  function enregistrer(tableau) {
    ecrire("ptc_" + mode, JSON.stringify(tableau));
  }

  /* ---------- Bips ---------- */

  var audio = null;

  function bip(ok) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator();
      var g = audio.createGain();
      o.frequency.value = ok ? 1800 : 300;
      g.gain.value = 0.2;
      o.connect(g); g.connect(audio.destination);
      o.start();
      o.stop(audio.currentTime + (ok ? 0.08 : 0.35));
    } catch (e) {}
  }

  function dire(texte, ok) {
    message.textContent = texte;
    message.className = ok ? "ok" : "erreur";
  }

  /* ---------- Affichage ---------- */

  function choisirMode(nouveau) {
    mode = nouveau;
    ecrire("ptc_mode", mode);
    codeEnAttente = "";
    zoneMotif.hidden = (mode !== "casse");
    document.getElementById("titre").textContent = "PTC Pop Licence — " + NOMS[mode];
    var boutons = document.querySelectorAll(".modes button");
    for (var i = 0; i < boutons.length; i++) {
      boutons[i].classList.toggle("actif", boutons[i].getAttribute("data-mode") === mode);
    }
    dire("", true);
    afficher();
    champCode.value = "";
    champCode.focus();
  }

  function afficher() {
    var tableau = lignes();
    liste.innerHTML = "";

    if (!tableau.length) {
      var vide = document.createElement("li");
      vide.className = "vide";
      vide.style.display = "block";
      vide.textContent = "Aucun article scanné en " + NOMS[mode] + ".";
      liste.appendChild(vide);
    }

    var pieces = 0;

    for (var i = tableau.length - 1; i >= 0; i--) {
      pieces += tableau[i].qte;
      liste.appendChild(ligneHtml(tableau[i], i));
    }

    document.getElementById("nbLignes").textContent =
      tableau.length + (tableau.length > 1 ? " références" : " référence");
    document.getElementById("nbPieces").textContent =
      pieces + (pieces > 1 ? " pièces" : " pièce");
  }

  function ligneHtml(l, index) {
    var li = document.createElement("li");

    var gauche = document.createElement("div");
    var code = document.createElement("div");
    code.className = "code";
    code.textContent = l.code;
    gauche.appendChild(code);

    if (l.motif) {
      var motif = document.createElement("div");
      motif.className = "motif";
      motif.textContent = l.motif;
      gauche.appendChild(motif);
    }

    var actions = document.createElement("div");
    actions.className = "actions";

    var moins = document.createElement("button");
    moins.textContent = "−";
    moins.onclick = function () { modifier(index, -1); };

    var n = document.createElement("span");
    n.className = "n";
    n.textContent = l.qte;

    var plus = document.createElement("button");
    plus.textContent = "+";
    plus.onclick = function () { modifier(index, 1); };

    var suppr = document.createElement("button");
    suppr.className = "suppr";
    suppr.textContent = "×";
    suppr.onclick = function () { supprimer(index); };

    actions.appendChild(moins);
    actions.appendChild(n);
    actions.appendChild(plus);
    actions.appendChild(suppr);

    li.appendChild(gauche);
    li.appendChild(actions);
    return li;
  }

  /* ---------- Saisie ---------- */

  function codeScanne() {
    var code = champCode.value.trim();
    if (!code) return;

    if (mode === "casse" && !champMotif.value) {
      bip(false);
      dire("Choisis d'abord le motif de la casse.", false);
      champCode.value = "";
      champMotif.focus();
      return;
    }

    codeEnAttente = code;
    bip(true);
    dire("Scanné : " + code + " — tape la quantité puis Entrée", true);
    champQte.value = "1";
    champQte.focus();
    champQte.select();
  }

  function ajouter() {
    var code = codeEnAttente || champCode.value.trim();
    if (!code) {
      bip(false);
      dire("Scanne d'abord un article.", false);
      champCode.focus();
      return;
    }

    var qte = parseInt(champQte.value, 10);
    if (!qte || qte < 1) {
      bip(false);
      dire("Quantité invalide.", false);
      champQte.select();
      return;
    }

    var motif = mode === "casse" ? champMotif.value : "";
    var tableau = lignes();
    var trouve = false;

    for (var i = 0; i < tableau.length; i++) {
      if (tableau[i].code === code && (tableau[i].motif || "") === motif) {
        tableau[i].qte += qte;
        var deplace = tableau.splice(i, 1)[0];
        tableau.push(deplace);
        trouve = true;
        break;
      }
    }

    if (!trouve) tableau.push({ code: code, qte: qte, motif: motif });

    enregistrer(tableau);
    afficher();
    bip(true);
    dire("+" + qte + " × " + code, true);

    codeEnAttente = "";
    champCode.value = "";
    champQte.value = "1";
    champCode.focus();
  }

  function modifier(index, delta) {
    var tableau = lignes();
    if (!tableau[index]) return;
    tableau[index].qte += delta;
    if (tableau[index].qte < 1) tableau[index].qte = 1;
    enregistrer(tableau);
    afficher();
    champCode.focus();
  }

  function supprimer(index) {
    var tableau = lignes();
    if (!tableau[index]) return;
    if (!confirm("Retirer " + tableau[index].code + " de la liste ?")) return;
    tableau.splice(index, 1);
    enregistrer(tableau);
    afficher();
    champCode.focus();
  }

  /* ---------- Export et remise à zéro ---------- */

  function horodatage() {
    var d = new Date();
    function deux(x) { return (x < 10 ? "0" : "") + x; }
    return d.getFullYear() + deux(d.getMonth() + 1) + deux(d.getDate()) +
      "_" + deux(d.getHours()) + deux(d.getMinutes());
  }

  function exporter() {
    var tableau = lignes();
    if (!tableau.length) {
      bip(false);
      dire("Rien à exporter.", false);
      return;
    }

    var texte = tableau.map(function (l) {
      var champs = [l.code, l.qte];
      if (mode === "casse") champs.push(l.motif || "");
      return champs.join(";");
    }).join("\r\n") + "\r\n";

    var nom = mode + "_" + horodatage() + ".txt";
    var lien = document.createElement("a");
    lien.href = URL.createObjectURL(new Blob([texte], { type: "text/plain" }));
    lien.download = nom;
    document.body.appendChild(lien);
    lien.click();
    document.body.removeChild(lien);

    bip(true);
    dire("Fichier " + nom + " enregistré dans Download. Vide la liste une fois importé au PC.", true);
    champCode.focus();
  }

  function vider() {
    if (!lignes().length) return;
    if (!confirm("Vider la liste " + NOMS[mode] + " ? Fais-le seulement après l'import au PC.")) return;
    enregistrer([]);
    afficher();
    dire("Liste vidée.", true);
    champCode.focus();
  }

  /* ---------- Branchements ---------- */

  champCode.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); codeScanne(); }
  });

  champQte.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); ajouter(); }
  });

  document.getElementById("ajouter").onclick = ajouter;
  document.getElementById("exporter").onclick = exporter;
  document.getElementById("vider").onclick = vider;

  champMotif.addEventListener("change", function () {
    ecrire("ptc_motif", champMotif.value);
    champCode.focus();
  });

  champMotif.value = lire("ptc_motif") || "";

  var boutons = document.querySelectorAll(".modes button");
  for (var i = 0; i < boutons.length; i++) {
    boutons[i].onclick = function () { choisirMode(this.getAttribute("data-mode")); };
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  choisirMode(mode);

})();
</script>
</body>
</html>
